<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>健身訓練記錄 · Workout Tracker</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #1c1c1e;
      --card-sub-bg: #2c2c2e;
      --accent: #ff453a; /* Apple Activity Red/Orange */
      --accent-green: #30d158; /* Apple Fitness Green */
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang TC", "Heiti TC", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 90px;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    header {
      padding: 24px 20px 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }
    .header-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-badge {
      font-size: 11px;
      background: rgba(255, 69, 58, 0.18);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* App Container */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px;
    }

    /* Tabs Content */
    .tab-pane {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    .tab-pane.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border-color);
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background-color: var(--accent-green);
      color: #000;
    }
    .btn-primary:active {
      opacity: 0.8;
      transform: scale(0.98);
    }
    .btn-secondary {
      background-color: var(--card-sub-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:active {
      background-color: #3a3a3c;
    }
    .btn-danger {
      background: rgba(255, 69, 58, 0.15);
      color: var(--accent);
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: var(--radius-sm);
    }

    /* Muscle Category Badges */
    .category-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .chip {
      background: var(--card-sub-bg);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .chip.active {
      background: var(--accent-green);
      color: #000000;
      font-weight: 700;
    }

    /* Exercise Item Card */
    .exercise-block {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 16px;
      margin-bottom: 16px;
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 10px;
    }
    .exercise-name {
      font-size: 17px;
      font-weight: 700;
    }
    .exercise-category-tag {
      font-size: 12px;
      background: rgba(10, 132, 255, 0.15);
      color: var(--accent-blue);
      padding: 3px 8px;
      border-radius: 12px;
      margin-left: 6px;
    }

    /* Sets Table */
    .sets-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    .sets-table th {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      text-align: center;
      padding-bottom: 8px;
    }
    .sets-table td {
      padding: 6px 4px;
      text-align: center;
    }
    .set-input {
      width: 100%;
      max-width: 80px;
      background: var(--card-sub-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .set-input:focus {
      outline: none;
      border-color: var(--accent-green);
    }
    .set-check {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: var(--card-sub-bg);
      border: 2px solid var(--border-color);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .set-check:checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }
    .set-check:checked::after {
      content: '✓';
      color: #000;
      font-size: 18px;
      font-weight: 900;
    }

    /* Rest Timer Floating Sheet / Modal */
    #rest-timer-modal {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 480px;
      background: rgba(28, 28, 30, 0.94);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(48, 209, 88, 0.4);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translate(-50%, 40px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }
    .timer-info {
      display: flex;
      flex-direction: column;
    }
    .timer-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .timer-display {
      font-size: 28px;
      font-weight: 800;
      color: var(--accent-green);
      font-variant-numeric: tabular-nums;
    }
    .timer-actions {
      display: flex;
      gap: 8px;
    }

    /* Bottom Navigation Bar */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 78px;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: calc(env(safe-area-inset-bottom, 12px) + 4px);
      z-index: 150;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.15s ease;
      background: none;
      border: none;
      outline: none;
    }
    .nav-item.active {
      color: var(--accent-green);
    }
    .nav-icon {
      font-size: 22px;
    }

    /* List & Form Controls */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: block;
    }
    .form-control {
      width: 100%;
      background: var(--card-sub-bg);
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 15px;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--accent-green);
    }

    .data-list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .data-list-item:last-child {
      border-bottom: none;
    }

    /* Simple Modal */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
    }
    .modal-box {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="header-title">
      <span>💪 健身記錄</span>
      <span class="header-badge">PRO</span>
    </div>
    <div id="session-timer" style="font-size: 15px; font-weight: 700; color: var(--text-muted); font-variant-numeric: tabular-nums;">
      00:00
    </div>
  </header>

  <div class="container">

    <!-- 1. 今日訓練分頁 (WORKOUT TAB) -->
    <section id="tab-workout" class="tab-pane active">
      <div class="card" style="margin-bottom: 14px;">
        <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">快速篩選部位</div>
        <div class="category-chips" id="filter-chips">
          <span class="chip active" onclick="filterWorkoutCategory('全部')">全部</span>
          <span class="chip" onclick="filterWorkoutCategory('胸')">胸</span>
          <span class="chip" onclick="filterWorkoutCategory('背')">背</span>
          <span class="chip" onclick="filterWorkoutCategory('腿')">腿</span>
          <span class="chip" onclick="filterWorkoutCategory('肩')">肩</span>
          <span class="chip" onclick="filterWorkoutCategory('手臂')">手臂</span>
          <span class="chip" onclick="filterWorkoutCategory('核心')">核心</span>
          <span class="chip" onclick="filterWorkoutCategory('有氧')">有氧 🏃</span>
        </div>
        <button class="btn btn-primary" style="width: 100%;" onclick="openAddExerciseToSessionModal()">
          ＋ 新增訓練動作
        </button>
      </div>

      <!-- 當前已選動作清單 -->
      <div id="current-workout-list"></div>

      <!-- 完成結算按鈕 -->
      <button id="finish-workout-btn" class="btn btn-secondary" style="width: 100%; margin-top: 10px; display: none;" onclick="finishCurrentWorkout()">
        🎉 完成並儲存本次訓練
      </button>
    </section>

    <!-- 2. 歷史與數據分析分頁 (HISTORY TAB) -->
    <section id="tab-history" class="tab-pane">
      <div class="card">
        <div class="card-title">
          <span>📊 訓練歷程記錄</span>
          <span id="history-total-count" style="font-size: 13px; color: var(--text-muted);">0 次訓練</span>
        </div>
        <div id="history-list-container"></div>
      </div>
    </section>

    <!-- 3. 動作庫分頁 (LIBRARY TAB) -->
    <section id="tab-library" class="tab-pane">
      <div class="card">
        <div class="card-title">
          <span>🏋️ 自訂動作庫</span>
          <button class="btn btn-primary btn-sm" onclick="openCreateCustomExerciseModal()">＋ 新增動作</button>
        </div>
        <div id="library-list-container"></div>
      </div>
    </section>

    <!-- 4. 設定與資料備份 (SETTINGS TAB) -->
    <section id="tab-settings" class="tab-pane">
      <div class="card">
        <div class="card-title">💾 數據備份與還原</div>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
          所有訓練資料儲存在手機本機 (localStorage)。定期下載 JSON 備份可防止 Safari 清除暫存或換機時資料遺失。
        </p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btn btn-secondary" onclick="exportFullBackupJSON()">
            📥 備份全部資料 (JSON 檔)
          </button>
          <button class="btn btn-secondary" onclick="document.getElementById('import-json-file').click()">
            📤 從 JSON 檔還原資料
          </button>
          <input type="file" id="import-json-file" accept=".json" style="display: none;" onchange="importBackupJSON(this)">
          <button class="btn btn-secondary" onclick="exportWorkoutHistoryCSV()">
            📊 匯出訓練日誌 (CSV 檔 / 適用 Excel)
          </button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">⏱️ 預設組間休息時間</div>
        <div class="form-group">
          <label class="form-label">打勾完成自動倒數 (秒)</label>
          <select id="setting-rest-seconds" class="form-control" onchange="saveRestSetting(this.value)">
            <option value="60">60 秒 (肌肥大 / 輕量組)</option>
            <option value="90" selected>90 秒 (經典建議)</option>
            <option value="120">120 秒 (大重量組)</option>
            <option value="180">180 秒 (複合大重量 / 力量)</option>
          </select>
        </div>
      </div>

      <div class="card">
        <div class="card-title" style="color: var(--accent);">⚠️ 危險區域</div>
        <button class="btn btn-danger" style="width: 100%;" onclick="resetToFactoryDefault()">
          重設動作庫為預設值
        </button>
      </div>
    </section>

  </div>

  <!-- 組間休息浮動視窗 (Floating Rest Timer) -->
  <div id="rest-timer-modal">
    <div class="timer-info">
      <div class="timer-label">組間休息倒數</div>
      <div class="timer-display" id="rest-timer-display">01:30</div>
    </div>
    <div class="timer-actions">
      <button class="btn btn-secondary btn-sm" onclick="adjustRestTimer(30)">+30s</button>
      <button class="btn btn-danger btn-sm" onclick="cancelRestTimer()">跳過</button>
    </div>
  </div>

  <!-- 底部導覽列 -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('tab-workout', this)">
      <span class="nav-icon">🏋️</span>
      <span>今日訓練</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-history', this)">
      <span class="nav-icon">📊</span>
      <span>歷史歷程</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-library', this)">
      <span class="nav-icon">📖</span>
      <span>動作庫</span>
    </button>
    <button class="nav-item" onclick="switchTab('tab-settings', this)">
      <span class="nav-icon">⚙️</span>
      <span>設定備份</span>
    </button>
  </nav>

  <!-- Modal: 選擇動作加入訓練 -->
  <div class="modal-backdrop" id="modal-add-exercise">
    <div class="modal-box">
      <div class="card-title">
        <span>選擇訓練動作</span>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-add-exercise')">✕</button>
      </div>
      <div id="modal-exercise-list" style="max-height: 320px; overflow-y: auto; margin-top: 10px;"></div>
    </div>
  </div>

  <!-- Modal: 新增自訂動作 -->
  <div class="modal-backdrop" id="modal-custom-exercise">
    <div class="modal-box">
      <div class="card-title">
        <span>新增自訂動作</span>
        <button class="btn btn-secondary btn-sm" onclick="closeModal('modal-custom-exercise')">✕</button>
      </div>
      <div class="form-group">
        <label class="form-label">動作名稱</label>
        <input type="text" id="custom-ex-name" class="form-control" placeholder="例如：滑輪面拉">
      </div>
      <div class="form-group">
        <label class="form-label">目標肌群</label>
        <select id="custom-ex-cat" class="form-control">
          <option value="胸">胸</option>
          <option value="背">背</option>
          <option value="腿">腿</option>
          <option value="肩">肩</option>
          <option value="手臂">手臂</option>
          <option value="核心">核心</option>
          <option value="有氧">有氧 🏃</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="saveCustomExercise()">
        儲存動作
      </button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 預設動作範本庫 (Default Exercise Templates)
       ========================================================================== */
    const DEFAULT_EXERCISES = [
      // 胸
      { id: 'ex_1', name: '槓鈴平躺臥推', category: '胸' },
      { id: 'ex_2', name: '上斜啞鈴臥推', category: '胸' },
      { id: 'ex_3', name: '滑輪夾胸', category: '胸' },
      { id: 'ex_4', name: '雙槓體撐', category: '胸' },
      // 背
      { id: 'ex_5', name: '滑輪下拉', category: '背' },
      { id: 'ex_6', name: '槓鈴划船', category: '背' },
      { id: 'ex_7', name: '坐姿滑輪划船', category: '背' },
      { id: 'ex_8', name: '引體向上', category: '背' },
      // 腿
      { id: 'ex_9', name: '槓鈴深蹲', category: '腿' },
      { id: 'ex_10', name: '羅馬尼亞硬舉 (RDL)', category: '腿' },
      { id: 'ex_11', name: '機械腿推舉', category: '腿' },
      { id: 'ex_12', name: '俯臥腿後彎舉', category: '腿' },
      // 肩
      { id: 'ex_13', name: '槓鈴肩推 (OHP)', category: '肩' },
      { id: 'ex_14', name: '啞鈴側平舉', category: '肩' },
      { id: 'ex_15', name: '滑輪面拉', category: '肩' },
      // 手臂
      { id: 'ex_16', name: '二頭槓鈴彎舉', category: '手臂' },
      { id: 'ex_17', name: '三頭肌滑輪下壓', category: '手臂' },
      // 核心與有氧
      { id: 'ex_18', name: '棒式', category: '核心' },
      { id: 'ex_19', name: '跑步機 / 慢跑', category: '有氧' },
      { id: 'ex_20', name: '飛輪腳踏車', category: '有氧' }
    ];

    /* 全域狀態 */
    let exercises = [];
    let currentSessionExercises = [];
    let sessionSeconds = 0;
    let sessionTimerInterval = null;
    let currentCategoryFilter = '全部';

    // 倒數休息計時
    let restTimerInterval = null;
    let restSecondsLeft = 0;
    let userDefaultRestSec = 90;

    /* 初始化 */
    window.addEventListener('DOMContentLoaded', () => {
      loadStorageData();
      renderCurrentSession();
      renderExerciseLibrary();
      renderHistoryList();
      startSessionTimer();
    });

    function loadStorageData() {
      // 動作庫
      const storedEx = localStorage.getItem('workout_exercises');
      if (!storedEx || JSON.parse(storedEx).length === 0) {
        exercises = DEFAULT_EXERCISES;
        localStorage.setItem('workout_exercises', JSON.stringify(exercises));
      } else {
        exercises = JSON.parse(storedEx);
      }

      // 休息時長設定
      const storedRest = localStorage.getItem('workout_rest_sec');
      if (storedRest) {
        userDefaultRestSec = parseInt(storedRest, 10);
        const sel = document.getElementById('setting-rest-seconds');
        if (sel) sel.value = storedRest;
      }
    }

    /* ==========================================================================
       2. 今日訓練邏輯 (Session & Auto-carry Set Values)
       ========================================================================== */
    function filterWorkoutCategory(cat) {
      currentCategoryFilter = cat;
      const chips = document.querySelectorAll('#filter-chips .chip');
      chips.forEach(chip => {
        if (chip.innerText.trim() === cat) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
    }

    function openAddExerciseToSessionModal() {
      const modalList = document.getElementById('modal-exercise-list');
      modalList.innerHTML = '';
      
      const filtered = currentCategoryFilter === '全部' 
        ? exercises 
        : exercises.filter(e => e.category === currentCategoryFilter);

      if (filtered.length === 0) {
        modalList.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">此部位尚無動作，請至「動作庫」新增</div>';
      } else {
        filtered.forEach(item => {
          const div = document.createElement('div');
          div.className = 'data-list-item';
          div.innerHTML = `
            <div>
              <span style="font-weight:600;">${item.name}</span>
              <span class="exercise-category-tag">${item.category}</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="addExerciseToCurrentSession('${item.id}')">選擇</button>
          `;
          modalList.appendChild(div);
        });
      }
      openModal('modal-add-exercise');
    }

    function addExerciseToCurrentSession(id) {
      const ex = exercises.find(e => e.id === id);
      if (!ex) return;

      currentSessionExercises.push({
        sessionExId: 'sex_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        exerciseId: ex.id,
        name: ex.name,
        category: ex.category,
        sets: [
          { setIndex: 1, weight: 20, reps: 10, completed: false }
        ]
      });

      closeModal('modal-add-exercise');
      renderCurrentSession();
    }

    function addSetToExercise(sIndex) {
      const ex = currentSessionExercises[sIndex];
      if (!ex) return;
      
      // 自動沿用上一組數值
      const lastSet = ex.sets[ex.sets.length - 1];
      const prevWeight = lastSet ? lastSet.weight : 20;
      const prevReps = lastSet ? lastSet.reps : 10;

      ex.sets.push({
        setIndex: ex.sets.length + 1,
        weight: prevWeight,
        reps: prevReps,
        completed: false
      });
      renderCurrentSession();
    }

    function removeSet(exIdx, setIdx) {
      currentSessionExercises[exIdx].sets.splice(setIdx, 1);
      // 重新編排組數索引
      currentSessionExercises[exIdx].sets.forEach((s, idx) => s.setIndex = idx + 1);
      renderCurrentSession();
    }

    function removeExerciseFromSession(idx) {
      if (confirm('確定移除此動作？')) {
        currentSessionExercises.splice(idx, 1);
        renderCurrentSession();
      }
    }

    function renderCurrentSession() {
      const container = document.getElementById('current-workout-list');
      const finishBtn = document.getElementById('finish-workout-btn');
      container.innerHTML = '';

      if (currentSessionExercises.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding: 40px 20px; color: var(--text-muted);">
            <div style="font-size: 38px; margin-bottom: 8px;">🏋️</div>
            <div style="font-weight: 600; font-size: 16px;">今日尚無訓練動作</div>
            <div style="font-size: 13px; margin-top: 4px;">點擊上方「＋ 新增訓練動作」開始記錄</div>
          </div>
        `;
        finishBtn.style.display = 'none';
        return;
      }

      finishBtn.style.display = 'block';

      currentSessionExercises.forEach((item, exIdx) => {
        const isCardio = item.category === '有氧';
        const block = document.createElement('div');
        block.className = 'exercise-block';

        let setsRows = item.sets.map((s, sIdx) => `
          <tr>
            <td style="color:var(--text-muted); font-size:13px;">${s.setIndex}</td>
            <td>
              <input type="number" step="0.5" class="set-input" value="${s.weight}" 
                onchange="updateSetValue(${exIdx}, ${sIdx}, 'weight', this.value)">
            </td>
            <td>
              <input type="number" class="set-input" value="${s.reps}" 
                onchange="updateSetValue(${exIdx}, ${sIdx}, 'reps', this.value)">
            </td>
            <td>
              <input type="checkbox" class="set-check" ${s.completed ? 'checked' : ''} 
                onchange="toggleSetComplete(${exIdx}, ${sIdx}, this)">
            </td>
            <td>
              <button class="btn btn-sm" style="background:none; color:var(--text-muted); padding:4px;" 
                onclick="removeSet(${exIdx}, ${sIdx})">✕</button>
            </td>
          </tr>
        `).join('');

        block.innerHTML = `
          <div class="exercise-header">
            <div>
              <span class="exercise-name">${item.name}</span>
              <span class="exercise-category-tag">${item.category}</span>
            </div>
            <button class="btn btn-sm btn-danger" onclick="removeExerciseFromSession(${exIdx})">刪除</button>
          </div>
          <table class="sets-table">
            <thead>
              <tr>
                <th style="width: 15%;">組數</th>
                <th style="width: 30%;">${isCardio ? '阻力 / 坡度' : '重量 (kg)'}</th>
                <th style="width: 30%;">${isCardio ? '時間 (分)' : '次數 (次)'}</th>
                <th style="width: 15%;">完成</th>
                <th style="width: 10%;"></th>
              </tr>
            </thead>
            <tbody>
              ${setsRows}
            </tbody>
          </table>
          <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="addSetToExercise(${exIdx})">
            ＋ 新增一組
          </button>
        `;
        container.appendChild(block);
      });
    }

    function updateSetValue(exIdx, sIdx, field, val) {
      if (currentSessionExercises[exIdx] && currentSessionExercises[exIdx].sets[sIdx]) {
        currentSessionExercises[exIdx].sets[sIdx][field] = parseFloat(val) || 0;
      }
    }

    /* ==========================================================================
       3. 打勾自動觸發組間休息計時器 (Rest Timer & Vibration)
       ========================================================================== */
    function toggleSetComplete(exIdx, sIdx, checkbox) {
      const checked = checkbox.checked;
      currentSessionExercises[exIdx].sets[sIdx].completed = checked;

      if (checked) {
        startRestTimer(userDefaultRestSec);
      }
    }

    function startRestTimer(seconds) {
      clearInterval(restTimerInterval);
      restSecondsLeft = seconds;
      updateRestTimerDisplay(restSecondsLeft);

      const modal = document.getElementById('rest-timer-modal');
      modal.style.display = 'flex';

      restTimerInterval = setInterval(() => {
        restSecondsLeft--;
        updateRestTimerDisplay(restSecondsLeft);

        if (restSecondsLeft <= 0) {
          clearInterval(restTimerInterval);
          modal.style.display = 'none';

          // 手機震動提示 (震動300ms, 暫停150ms, 再震動300ms)
          if ('vibrate' in navigator) {
            navigator.vibrate([300, 150, 300]);
          }
        }
      }, 1000);
    }

    function adjustRestTimer(addSec) {
      restSecondsLeft += addSec;
      updateRestTimerDisplay(restSecondsLeft);
    }

    function cancelRestTimer() {
      clearInterval(restTimerInterval);
      document.getElementById('rest-timer-modal').style.display = 'none';
    }

    function updateRestTimerDisplay(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      document.getElementById('rest-timer-display').innerText = `${m}:${s}`;
    }

    /* ==========================================================================
       4. 訓練結束與儲存歷史 (Save Workout Session)
       ========================================================================== */
    function finishCurrentWorkout() {
      if (currentSessionExercises.length === 0) return;
      if (!confirm('確定結束並儲存本次訓練？')) return;

      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      const newRecord = {
        id: 'rec_' + Date.now(),
        date: new Date().toISOString(),
        durationMinutes: Math.max(1, Math.round(sessionSeconds / 60)),
        items: JSON.parse(JSON.stringify(currentSessionExercises))
      };

      history.unshift(newRecord);
      localStorage.setItem('workout_history', JSON.stringify(history));

      alert('🎉 太棒了！訓練記錄已成功儲存。');
      currentSessionExercises = [];
      sessionSeconds = 0;
      renderCurrentSession();
      renderHistoryList();
      switchTab('tab-history', document.querySelectorAll('.bottom-nav .nav-item')[1]);
    }

    /* ==========================================================================
       5. 歷史歷程清單 (History View)
       ========================================================================== */
    function renderHistoryList() {
      const container = document.getElementById('history-list-container');
      const countBadge = document.getElementById('history-total-count');
      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      
      countBadge.innerText = `${history.length} 次訓練`;
      container.innerHTML = '';

      if (history.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">尚無訓練記錄，開始你的第一次訓練吧！</div>';
        return;
      }

      history.forEach(item => {
        const d = new Date(item.date);
        const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        
        let exerciseNames = item.items.map(i => `${i.name} (${i.sets.length}組)`).join(' · ');

        const card = document.createElement('div');
        card.className = 'data-list-item';
        card.style.flexDirection = 'column';
        card.style.alignItems = 'flex-start';
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; width:100%; margin-bottom:4px;">
            <span style="font-weight:700; font-size:15px; color:var(--accent-green);">${dateStr}</span>
            <span style="font-size:12px; color:var(--text-muted);">耗時約 ${item.durationMinutes} 分鐘</span>
          </div>
          <div style="font-size:13px; color:#ccc;">${exerciseNames}</div>
        `;
        container.appendChild(card);
      });
    }

    /* ==========================================================================
       6. 動作庫管理 (Library Management)
       ========================================================================== */
    function renderExerciseLibrary() {
      const container = document.getElementById('library-list-container');
      container.innerHTML = '';

      exercises.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'data-list-item';
        div.innerHTML = `
          <div>
            <span style="font-weight:600;">${item.name}</span>
            <span class="exercise-category-tag">${item.category}</span>
          </div>
          <button class="btn btn-sm btn-danger" onclick="deleteCustomExercise(${idx})">刪除</button>
        `;
        container.appendChild(div);
      });
    }

    function openCreateCustomExerciseModal() {
      document.getElementById('custom-ex-name').value = '';
      openModal('modal-custom-exercise');
    }

    function saveCustomExercise() {
      const name = document.getElementById('custom-ex-name').value.trim();
      const cat = document.getElementById('custom-ex-cat').value;
      if (!name) {
        alert('請輸入動作名稱！');
        return;
      }

      exercises.push({
        id: 'custom_' + Date.now(),
        name: name,
        category: cat
      });

      localStorage.setItem('workout_exercises', JSON.stringify(exercises));
      closeModal('modal-custom-exercise');
      renderExerciseLibrary();
    }

    function deleteCustomExercise(idx) {
      if (confirm('確定從動作庫刪除此動作？')) {
        exercises.splice(idx, 1);
        localStorage.setItem('workout_exercises', JSON.stringify(exercises));
        renderExerciseLibrary();
      }
    }

    function resetToFactoryDefault() {
      if (confirm('確定要將動作庫恢復至初始預設值嗎？')) {
        exercises = DEFAULT_EXERCISES;
        localStorage.setItem('workout_exercises', JSON.stringify(exercises));
        renderExerciseLibrary();
        alert('已成功重設為預設動作庫！');
      }
    }

    /* ==========================================================================
       7. JSON 完整備份 / 還原 & CSV 匯出 (Backup & Export)
       ========================================================================== */
    function exportFullBackupJSON() {
      const backupData = {
        version: '2.0-apple',
        exportDate: new Date().toISOString(),
        exercises: exercises,
        history: JSON.parse(localStorage.getItem('workout_history') || '[]'),
        restSeconds: userDefaultRestSec
      };

      const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workout_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON(fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (data.exercises && data.history) {
            if (confirm('確定要還原備份嗎？這將覆蓋當前裝置的所有訓練資料。')) {
              localStorage.setItem('workout_exercises', JSON.stringify(data.exercises));
              localStorage.setItem('workout_history', JSON.stringify(data.history));
              if (data.restSeconds) localStorage.setItem('workout_rest_sec', data.restSeconds);
              alert('備份還原成功！');
              location.reload();
            }
          } else {
            alert('檔案格式不符，請上傳正確的備份檔！');
          }
        } catch (err) {
          alert('解析備份檔案失敗，請確認檔案內容。');
        }
      };
      reader.readAsText(file);
    }

    function exportWorkoutHistoryCSV() {
      const history = JSON.parse(localStorage.getItem('workout_history') || '[]');
      if (history.length === 0) {
        alert('目前無歷史紀錄可供匯出！');
        return;
      }

      const rows = [['日期', '部位', '動作名稱', '組數', '重量(kg)/阻力', '次數/時間', '是否完成']];

      history.forEach(session => {
        const d = new Date(session.date);
        const dateStr = `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`;
        (session.items || []).forEach(item => {
          (item.sets || []).forEach(s => {
            rows.push([
              dateStr,
              item.category || '',
              `"${(item.name || '').replace(/"/g, '""')}"`,
              s.setIndex || 1,
              s.weight || 0,
              s.reps || 0,
              s.completed ? '是' : '否'
            ]);
          });
        });
      });

      const csvContent = '﻿' + rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `workout_history_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function saveRestSetting(val) {
      userDefaultRestSec = parseInt(val, 10);
      localStorage.setItem('workout_rest_sec', userDefaultRestSec);
    }

    /* ==========================================================================
       8. 導航與輔助工具
       ========================================================================== */
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (btn) btn.classList.add('active');
    }

    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    function startSessionTimer() {
      sessionTimerInterval = setInterval(() => {
        sessionSeconds++;
        const m = Math.floor(sessionSeconds / 60).toString().padStart(2, '0');
        const s = (sessionSeconds % 60).toString().padStart(2, '0');
        document.getElementById('session-timer').innerText = `${m}:${s}`;
      }, 1000);
    }
  </script>
</body>
</html>
